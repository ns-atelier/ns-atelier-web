<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex,nosnippet" />
  <meta name="theme-color" content="#f9f0e0" />
  <title>Invitación especial · N&amp;S ATELIER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Ovo&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f9f0e0;
      --ink: #6c513f;
      --accent: #a67d2b;
      --btn-bg: #5a0f1b;
      --line: rgba(156, 133, 117, .32);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-ovo: 'Ovo', Georgia, serif;
      --font-cinzel: 'Cinzel', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background: var(--bg); overflow-x: hidden; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-display); overflow-x: hidden; }
    body.locked { overflow: hidden; }
    [hidden] { display: none !important; }
    img { display: block; max-width: 100%; }
    button { font: inherit; cursor: pointer; }

    /* Loading & Error */
    #loading { position: fixed; inset: 0; z-index: 200000; background: var(--bg); display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px; font: 20px Georgia, serif; color: var(--ink); }
    #loading.hidden { display: none; }
    .errBox { max-width: 420px; background: #fffaf3; border: 1px solid #e5d5c1; border-radius: 14px; padding: 26px; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.6; }
    .errBox h2 { font-family: Georgia, serif; margin-bottom: 10px; color: var(--accent); }
    .errBox a { display: inline-block; margin-top: 14px; color: var(--btn-bg); font-weight: 600; }

    /* =====================================================================
       ENVELOPE OVERLAY & VIDEO (SHARED)
    ===================================================================== */
    #weiOverlay { position: fixed; inset: 0; z-index: 99999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; transition: opacity 1.3s ease; }
    #weiImg { width: 100%; max-width: 440px; max-height: 86vh; object-fit: contain; }
    #weiTapWrap { position: absolute; bottom: 28%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 7px; }
    #weiTapLabel { font-family: var(--font-cinzel); font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: rgba(140, 100, 60, .82); animation: weiPulse 2.4s ease-in-out infinite; white-space: nowrap; background: rgba(249, 240, 224, .75); padding: 4px 12px; border-radius: 999px; }
    .wei-chevron { width: 10px; height: 10px; border-right: 1.5px solid rgba(140, 100, 60, .65); border-top: 1.5px solid rgba(140, 100, 60, .65); transform: rotate(-45deg); animation: weiChev 2.4s ease-in-out infinite; }
    @keyframes weiPulse { 0%, 100% { opacity: .55; letter-spacing: .26em; } 50% { opacity: 1; letter-spacing: .30em; } }
    @keyframes weiChev { 0%, 100% { transform: rotate(-45deg) translate(0, 0); } 50% { transform: rotate(-45deg) translate(2px, -2px); } }

    #weiVideoWrap { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center; background: var(--bg); opacity: 0; transition: opacity .7s ease; pointer-events: none; }
    #weiVideoWrap.wei-video-in { opacity: 1; pointer-events: all; }
    #weiVideoWrap.wei-video-out { opacity: 0; transition: opacity 1.2s ease; }
    #weiVideo { width: 100%; max-width: 440px; max-height: 100vh; object-fit: contain; }
    #skipVideoBtn { position: absolute; bottom: 26px; right: 20px; border: 1px solid rgba(140, 100, 60, .4); background: rgba(255, 250, 242, .85); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 12px system-ui, sans-serif; }

    .fab-dock { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 90000; visibility: hidden; opacity: 0; transition: opacity .35s ease; }
    .fab-dock.visible { visibility: visible; opacity: 1; }
    .fab-btn { width: 50px; height: 50px; background: var(--btn-bg); color: #fff; border: 1px solid rgba(255,255,255,.22); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 14px rgba(40, 12, 18, .28); transition: transform .2s ease, opacity .2s ease; }
    .fab-btn:hover { transform: scale(1.07); }
    .fab-btn svg { width: 22px; height: 22px; fill: #fff; }
    .fab-btn.secondary { width: 44px; height: 44px; background: rgba(52, 42, 38, .88); }

    /* =====================================================================
       ENGINE A: THE SACRED GARDEN (100% EDITABLE FROM PANEL)
    ===================================================================== */
    .sg-page { width: 100%; min-height: 100vh; background: var(--bg); overflow-x: hidden; }
    .sg-artboard { position: relative; width: 100%; max-width: 450px; margin: 0 auto; background: var(--bg); }

    .anim-fadein { opacity: 0; transition: opacity 1.1s ease; }
    .anim-fadein.is-visible { opacity: 1; }
    .anim-fadeinup { opacity: 0; transform: translateY(28px); transition: opacity 1.3s ease, transform 1.3s ease; }
    .anim-fadeinup.is-visible { opacity: 1; transform: translateY(0); }
    .anim-zoomin { opacity: 0; transform: scale(.92); transition: opacity 1.1s ease, transform 1.1s ease; }
    .anim-zoomin.is-visible { opacity: 1; transform: scale(1); }

    .sg-hero { height: 1240px; overflow: hidden; }
    .sg-hero-video { position: absolute; top: 0; left: 0; width: 100%; height: 762px; z-index: 1; overflow: hidden; }
    .sg-hero-video video { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .sg-hero-glow { position: absolute; top: 0; left: 0; width: 100%; height: 676px; z-index: 2; opacity: .5; background-image: radial-gradient(circle at center, rgba(255, 249, 235, 1) 0%, rgba(255, 231, 192, 0) 85%); pointer-events: none; }
    .sg-type { position: absolute; top: 154px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 40px; line-height: .95; font-weight: 300; }
    .sg-date { position: absolute; top: 198px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 25px; font-weight: 600; letter-spacing: .08em; }
    .sg-names { position: absolute; top: 288px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 74px; line-height: .75; font-weight: 700; text-shadow: 0 2px 14px rgba(249,240,224,.7); }
    .sg-names .sg-amp { display: block; font-size: 40px; font-weight: 300; font-style: italic; line-height: 1.25; }
    .sg-scroll-lbl { position: absolute; top: 518px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 30px; font-weight: 300; text-decoration: none; }
    .sg-scroll-chev { position: absolute; top: 558px; left: 50%; width: 25px; margin-left: -12.5px; z-index: 4; animation: sgBounce 1.1s ease-in-out infinite; }
    @keyframes sgBounce { 0%, 100% { transform: translateY(0); } 54% { transform: translateY(5px); } }

    .sg-branch-l { position: absolute; top: 566px; left: -16px; width: 224px; z-index: 3; pointer-events: none; transform-origin: bottom left; animation: swayL 4s ease-in-out infinite; }
    .sg-branch-r { position: absolute; top: 547px; right: -16px; width: 236px; z-index: 3; pointer-events: none; transform-origin: bottom right; animation: swayR 4s ease-in-out infinite; }
    @keyframes swayL { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.06) rotate(2deg); } }
    @keyframes swayR { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.04) rotate(-2deg); } }

    .sg-welcome-bg { position: absolute; top: 753px; left: 50%; transform: translateX(-50%); width: 744px; height: 487px; z-index: 2; pointer-events: none; }
    .sg-welcome-bg img { width: 100%; height: 100%; object-fit: fill; }
    .sg-calig { position: absolute; top: 813px; left: 50%; transform: translateX(-50%); width: 280px; max-height: 90px; object-fit: contain; z-index: 4; }
    .sg-quote { position: absolute; top: 902px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; text-align: center; z-index: 4; color: var(--accent); font-size: 36px; line-height: 1.08; font-weight: 300; white-space: pre-line; }
    .sg-msg { position: absolute; top: 1048px; left: 50%; transform: translateX(-50%); width: 315px; max-width: 88%; text-align: center; z-index: 4; color: var(--ink); font-size: 20px; line-height: 1.28; white-space: pre-line; }

    .sg-title { color: var(--accent); font-family: var(--font-display); font-size: 39px; line-height: 1.2; font-weight: 300; text-align: center; }

    /* Countdown */
    .sg-countdown { padding: 26px 12px 34px; text-align: center; }
    .sg-cd-row { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 20px auto 8px; }
    .sg-tb { text-align: center; min-width: 66px; }
    .sg-num { font-size: 44px; font-family: var(--font-ovo); line-height: 1.15; background: linear-gradient(105deg, var(--accent) 0%, #d8ba72 52%, var(--accent) 100%); background-size: 260% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 4.5s ease-in-out infinite; }
    @keyframes shimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }
    .sg-lbl { font-size: 17px; margin-top: 5px; color: var(--accent); font-family: var(--font-ovo); opacity: .85; }
    .sg-sep { font-size: 46px; margin-top: -32px; color: var(--accent); font-family: var(--font-ovo); opacity: .85; }

    /* Schedule */
    .sg-schedule { position: relative; padding: 42px 16px 56px; overflow: hidden; min-height: 540px; }
    .sg-sched-bg1 { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 744px; height: 346px; z-index: 1; pointer-events: none; }
    .sg-sched-bg2 { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 744px; height: 259px; z-index: 1; pointer-events: none; }
    .sg-sched-bg1 img, .sg-sched-bg2 img { width: 100%; height: 100%; object-fit: fill; }
    .sg-sched-head { position: relative; z-index: 4; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 36px; }
    .sg-sched-head img { width: 68px; flex-shrink: 0; }
    .sg-timeline { position: relative; z-index: 4; max-width: 360px; margin: 0 auto; padding: 8px 0; }
    .sg-timeline::before { content: ''; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 1px; background: #9c8575; opacity: .7; transform: translateX(-50%); }
    .sg-rose { position: absolute; top: 0; left: 50%; width: 52px; margin-left: -26px; z-index: 5; pointer-events: none; transform: translateY(0px) rotate(325deg); transition: transform .12s linear; }
    .sg-row { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; padding: 17px 0; position: relative; }
    .sg-row-time { text-align: right; padding-right: 18px; color: #846f61; font-size: 28px; font-weight: 600; }
    .sg-diamond { width: 8px; height: 8px; background: #8c7666; transform: rotate(45deg); margin: 0 auto; }
    .sg-row-name { text-align: left; padding-left: 18px; color: var(--ink); font-size: 20px; line-height: 1.15; }
    .sg-row-name small { display: block; font-size: 14px; opacity: .75; margin-top: 2px; }

    /* Location & Petals */
    .sg-location { padding: 30px 16px 20px; text-align: center; overflow: hidden; }
    .sg-loc-decor { width: 96px; margin: 6px auto 4px; }
    .sg-venue { font-size: 22px; font-weight: 500; margin-top: 6px; }
    .sg-addr { font-size: 18px; line-height: 1.3; max-width: 310px; margin: 4px auto 10px; }
    .sg-venue-art { width: 370px; max-width: 92%; margin: 6px auto 0; }
    .sg-petal { position: absolute; z-index: 5; pointer-events: none; opacity: 0; }
    .sg-location.petals-on .p1 { top: 45px; right: 24px; width: 40px; animation: pf1 8s ease-in-out infinite; }
    .sg-location.petals-on .p2 { top: 40px; left: 54px; width: 42px; animation: pf2 8.5s .4s ease-in-out infinite; }
    .sg-location.petals-on .p3 { top: 150px; left: 16px; width: 40px; animation: pf1 9s .8s ease-in-out infinite; }
    .sg-location.petals-on .p4 { top: 170px; right: 16px; width: 36px; animation: pf2 8s 1.2s ease-in-out infinite; }
    @keyframes pf1 { 0% { opacity: 0; transform: translate(0, 0) rotate(0deg); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(55px, 280px) rotate(-10deg); } }
    @keyframes pf2 { 0% { opacity: 0; transform: translate(0, 0) rotate(180deg); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-55px, 280px) rotate(200deg); } }

    /* Map */
    .sg-map { padding: 34px 0 56px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .sg-map-frame { position: relative; width: 341px; max-width: 92vw; height: 341px; display: flex; align-items: center; justify-content: center; }
    .sg-map-border { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .8; transform: rotate(180deg); pointer-events: none; z-index: 1; }
    .sg-map-iframe { position: relative; z-index: 2; width: 335px; max-width: calc(92vw - 6px); height: 335px; border: 0; border-radius: 15px; }
    .sg-map-top { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); width: 190px; z-index: 3; pointer-events: none; }
    .sg-map-bot { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); width: 190px; z-index: 3; pointer-events: none; }
    .sg-map-link { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-family: var(--font-ovo); font-size: 14px; }

    /* Dress Code & Gifts */
    .sg-dg { height: 491px; overflow: hidden; text-align: center; }
    .sg-dg-bg { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 744px; height: 453px; z-index: 1; pointer-events: none; }
    .sg-dg-bg img { width: 100%; height: 100%; object-fit: fill; }
    .sg-dg-r { position: absolute; top: 9px; right: -135px; width: 305px; z-index: 2; pointer-events: none; animation: swayR 7s ease-in-out infinite; }
    .sg-dg-l { position: absolute; top: 264px; left: -82px; width: 251px; z-index: 2; pointer-events: none; transform: rotate(274deg); }
    .sg-dg-inner { position: relative; z-index: 4; padding-top: 86px; }
    .sg-dg-text { margin: 12px auto 0; max-width: 305px; font-size: 21px; line-height: 1.28; }

    /* RSVP Section */
    .sg-rsvp { padding: 48px 16px 38px; text-align: center; }
    .sg-rsvp-desc { margin: 14px auto 0; max-width: 360px; font-size: 21px; line-height: 1.28; }
    .sg-seal-btn { margin-top: 22px; background: transparent; border: none; padding: 0; transition: transform .25s ease; }
    .sg-seal-btn:hover { transform: scale(1.05); }
    .sg-seal-btn img { width: 190px; margin: 0 auto; }
    .sg-click-cue { margin-top: 10px; display: inline-flex; flex-direction: column; align-items: center; cursor: pointer; animation: sgBounce 1.1s ease-in-out infinite; }
    .sg-click-cue span { color: var(--accent); font-size: 29px; font-weight: 300; }
    .sg-rsvp-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .sg-pill-btn { padding: 11px 22px; border-radius: 999px; background: var(--btn-bg); color: #f9f0e0; text-decoration: none; font-family: var(--font-ovo); font-size: 15px; border: 1px solid var(--btn-bg); }
    .sg-pill-btn.outline { background: transparent; color: var(--btn-bg); }

    /* Footer */
    .sg-footer { height: 673px; overflow: hidden; }
    .sg-footer-photo { position: absolute; top: 0; left: 0; width: 100%; height: 675px; object-fit: cover; z-index: 1; }
    .sg-footer-grad { position: absolute; top: 0; left: 0; width: 100%; height: 237px; background-image: linear-gradient(0turn, rgba(232, 221, 207, 0) 0%, var(--bg) 100%); z-index: 2; pointer-events: none; }
    .sg-footer-title { position: absolute; top: 14px; left: 0; width: 100%; z-index: 4; }
    .sg-footer-names { position: absolute; top: 72px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 28px; }
    .sg-footer-wreath { position: absolute; top: 173px; left: 50%; width: 537px; margin-left: -268.5px; z-index: 3; pointer-events: none; animation: swayR 4.5s ease-in-out infinite; }

    /* RSVP Modal */
    .rsvp-backdrop { position: fixed; inset: 0; z-index: 100001; background: rgba(0, 0, 0, .62); display: flex; align-items: center; justify-content: center; padding: 18px; opacity: 0; visibility: hidden; transition: .3s; }
    .rsvp-backdrop.is-open { opacity: 1; visibility: visible; }
    .rsvp-close { position: fixed; top: 18px; right: 20px; width: 40px; height: 40px; background: transparent; border: none; color: #fff; font-size: 28px; z-index: 100002; }
    .rsvp-dialog { width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; background: #fffaf8; border-radius: 6px; padding: 34px 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, .28); font-family: var(--font-ovo); color: #4f4f4f; }
    .rsvp-dialog h3 { text-align: center; font-size: 23px; font-weight: 400; margin-bottom: 6px; }
    .rsvp-dialog .sub { text-align: center; font-size: 15px; color: #777; margin-bottom: 22px; }
    .rsvp-field { margin-bottom: 16px; }
    .rsvp-field label { display: block; font-size: 15px; margin-bottom: 6px; }
    .rsvp-field input[type="text"] { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #c9c9c9; border-radius: 5px; font: 15px var(--font-ovo); }
    .rsvp-radios { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
    .rsvp-radios label { display: flex; align-items: center; gap: 9px; margin: 0; cursor: pointer; }
    .rsvp-submit { width: 100%; height: 52px; margin-top: 8px; background: var(--btn-bg); color: #f6f1e8; border: none; border-radius: 20px; font: 19px var(--font-ovo); }
    .rsvp-err { color: #b91c1c; font-size: 12.5px; margin-top: 4px; display: none; }
    .rsvp-err.on { display: block; }

    /* =====================================================================
       ENGINE B: CLASSIC N&S ATELIER TEMPLATES
    ===================================================================== */
    .cl-wrap { max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--bg); box-shadow: 0 20px 60px rgba(70, 62, 55, .14); text-align: center; }
    .cl-sec { padding: 56px 28px; border-bottom: 1px solid var(--line); }
    .cl-kicker { font: 10px system-ui, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); }
    .cl-names { font-size: clamp(44px, 11vw, 68px); font-weight: 400; color: var(--ink); margin: 16px 0; line-height: 1.1; }
    .cl-names span { display: block; font-style: italic; color: var(--accent); font-size: 36px; }
    .cl-h2 { font-size: 34px; font-weight: 400; margin: 12px 0 14px; color: var(--accent); }
    .cl-p { font-size: 17px; line-height: 1.75; max-width: 390px; margin: 8px auto; white-space: pre-line; }
    .cl-orn { width: 165px; margin: 12px auto 20px; opacity: .75; }
    .cl-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 22px; }
    .cl-gallery img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; }
    .cl-gallery img:nth-child(3) { grid-column: 1 / -1; aspect-ratio: 16/9; }

    @media (max-width: 410px) {
      .sg-names { font-size: 62px; }
      .sg-quote { font-size: 31px; }
      .sg-title { font-size: 33px; }
      .sg-num { font-size: 36px; }
      .sg-tb { min-width: 54px; }
      .sg-row-time { font-size: 24px; }
      .sg-row-name { font-size: 18px; }
    }

    /* =====================================================================
       ENGINE C: PERLA & NÁCAR (N&S ATELIER ORIGINAL)
    ===================================================================== */
    .pn-page {
      --pn-ivory: var(--bg, #faf6ee);
      --pn-slate-bg: #a9b8c2;
      --pn-slate-deep: var(--btn-bg, #4b5e75);
      --pn-ink: var(--ink, #4a5d70);
      --pn-gold: var(--accent, #b59457);
      width: 100%; min-height: 100vh; background: var(--pn-ivory); color: var(--pn-ink);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .pn-wrap { width: 100%; max-width: 460px; margin: 0 auto; background: var(--pn-ivory); box-shadow: 0 0 60px rgba(40,52,66,.12); overflow: hidden; }
    .pn-script { font-family: 'Great Vibes', var(--font-display), cursive; font-weight: 400; line-height: 1.1; }
    .pn-serif { font-family: 'Cormorant Garamond', var(--font-display), Georgia, serif; }
    .pn-kicker { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; font-weight: 600; opacity: .82; }

    /* Iridescent mother-of-pearl sheen */
    .pn-pearl-bg {
      background:
        radial-gradient(circle at 18% 22%, rgba(255,228,236,.78), transparent 45%),
        radial-gradient(circle at 82% 28%, rgba(212,238,246,.82), transparent 48%),
        radial-gradient(circle at 50% 78%, rgba(252,236,208,.85), transparent 52%),
        linear-gradient(135deg, #f8f3ec 0%, #edf4f6 38%, #f8eef2 70%, #f5efe3 100%);
    }
    .pn-linen-blue {
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px),
        linear-gradient(160deg, #b6c4ce 0%, #9fb1bd 52%, #a8b8c3 100%);
      color: #fff;
    }
    .pn-deep-blue {
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.08), transparent 40%),
        radial-gradient(circle at 80% 85%, rgba(255,255,255,.06), transparent 45%),
        linear-gradient(165deg, var(--pn-slate-deep), #354659);
      color: #faf6ee;
    }
    .pn-paper {
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.75), transparent 65%),
        var(--pn-ivory);
    }

    /* Section spacing & buttons */
    .pn-sec { padding: 54px 24px; text-align: center; position: relative; }
    .pn-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 26px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
      font-weight: 600; color: var(--pn-ink); background: transparent;
      border: 1.5px solid var(--pn-ink); outline: 1px solid rgba(74,93,112,.35); outline-offset: 3px;
      text-decoration: none; cursor: pointer; transition: all .25s ease;
    }
    .pn-btn:hover { background: var(--pn-ink); color: #faf6ee; }
    .pn-btn-light { color: #faf6ee; border-color: #faf6ee; outline-color: rgba(250,246,238,.4); }
    .pn-btn-light:hover { background: #faf6ee; color: var(--pn-slate-deep); }

    /* 1. Hero Card */
    .pn-hero { padding: 44px 20px 52px; }
    .pn-arch-frame {
      position: relative; padding: 48px 22px 42px; border-radius: 210px 210px 22px 22px;
      background: rgba(255,253,249,.86);
      border: 1.5px solid rgba(181,148,87,.42);
      box-shadow: inset 0 0 0 6px rgba(250,246,238,.9), inset 0 0 0 7px rgba(169,184,194,.45), 0 18px 40px rgba(74,93,112,.09);

    .pn-pearl-dots {
      display: flex; justify-content: center; gap: 10px; margin: 14px 0;
    }
    .pn-pearl {
      width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex-shrink: 0;
      background: radial-gradient(circle at 32% 28%, #ffffff 0%, #f4ede4 48%, #c9d5dc 85%, #9eb0bc 100%);
      box-shadow: 0 2px 5px rgba(74,93,112,.25), inset -1px -1px 2px rgba(120,136,150,.35);
    }
    .pn-pearl.lg { width: 15px; height: 15px; }
    .pn-hero-names { font-size: clamp(46px, 13vw, 60px); color: var(--pn-ink); margin: 14px 0 10px; }
    .pn-hero-date { font-size: 24px; letter-spacing: .16em; color: var(--pn-ink); margin-bottom: 14px; }
    .pn-hero-venue { font-size: 32px; color: var(--pn-ink); margin-bottom: 4px; }

    /* 2. Baroque Relief Frame (Countdown & Gifts) */
    .pn-relief-card {
      background: var(--pn-ivory); color: var(--pn-ink);
      border-radius: 28px; padding: 34px 20px; position: relative;
      border: 6px solid #dce5ea;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.75), 0 16px 36px rgba(42,57,72,.18), inset 0 0 0 1px rgba(169,184,194,.5);
    }
    .pn-cd-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin: 20px 0 8px; }
    .pn-cd-cell b { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1; color: var(--pn-ink); }
    .pn-cd-cell span { display: block; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; opacity: .75; margin-top: 4px; }

    /* 3. Scratch-to-Reveal Card */
    .pn-scratch-outer {
      padding: 26px 20px; border-radius: 22px; position: relative;
      border: 2px solid rgba(255,255,255,.85);
      box-shadow: 0 14px 34px rgba(74,93,112,.14);
    }
    .pn-scratch-oval {
      position: relative; width: 250px; height: 320px; margin: 0 auto;
      border-radius: 50%; overflow: hidden;
      border: 2px solid var(--pn-gold);
      box-shadow: 0 0 0 5px rgba(250,246,238,.9), 0 0 0 6.5px rgba(181,148,87,.55), 0 14px 28px rgba(74,93,112,.16);
      background: #e9e2d8; touch-action: none; user-select: none;
    }
    .pn-scratch-under {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; background: linear-gradient(160deg, #f3ece1, #dde6ec); color: var(--pn-ink);
    }
    .pn-scratch-under img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .pn-scratch-canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; z-index: 2; }
    .pn-scratch-hint { margin-top: 14px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--pn-ink); opacity: .8; }

    /* 4. Venue / Location */
    .pn-venue-art {
      width: 100%; max-width: 310px; min-height: 190px; margin: 20px auto 22px;
      border-radius: 16px; overflow: hidden; border: 1px solid rgba(169,184,194,.45);
      background: #fff; display: flex; align-items: center; justify-content: center;
    }
    .pn-venue-art img { width: 100%; height: auto; object-fit: cover; }

    /* 5. Pearl Timeline */
    .pn-timeline { position: relative; max-width: 330px; margin: 28px auto 0; text-align: left; padding-left: 34px; }
    .pn-timeline::before {
      content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px;
      width: 1.5px; background: linear-gradient(180deg, transparent, var(--pn-ink), transparent);
    }
    .pn-tl-item { position: relative; padding-bottom: 24px; }
    .pn-tl-item:last-child { padding-bottom: 0; }
    .pn-tl-item .pn-pearl { position: absolute; left: -34px; top: 4px; }
    .pn-tl-time { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; font-weight: 700; color: var(--pn-ink); }
    .pn-tl-title { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; color: var(--pn-gold); margin: 2px 0 3px; }
    .pn-tl-desc { font-size: 13px; opacity: .85; line-height: 1.5; }

    /* 6. Dress Code Frame + Wax Seal */
    .pn-double-frame {
      position: relative; border: 1.5px solid rgba(74,93,112,.45); padding: 36px 22px;
      border-radius: 18px; background: rgba(255,253,249,.85);
      outline: 1px solid rgba(74,93,112,.25); outline-offset: 6px;
    }
    .pn-wax-seal {
      width: 68px; height: 68px; border-radius: 50%; margin: 0 auto;
      display: grid; place-items: center;
      background: radial-gradient(circle at 32% 28%, #fffaf0 0%, #ebd9b4 45%, #c5a15b 85%, #9a7836 100%);
      color: #523e1a; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 21px; font-weight: 700;
      box-shadow: 0 8px 20px rgba(82,62,26,.28), inset 0 0 0 3px rgba(255,250,240,.5);
    }
    .pn-wax-seal.pearl {
      background: radial-gradient(circle at 30% 25%, #ffffff 0%, #f4ece6 42%, #d4dfe6 75%, #b8c6d0 100%);
      color: var(--pn-ink); box-shadow: 0 8px 20px rgba(74,93,112,.25), inset 0 0 0 3px rgba(255,255,255,.7);
    }
    .pn-seal-corner { position: absolute; right: -12px; bottom: -22px; transform: rotate(-8deg); }

    /* 7. Travel & Stay Cards */
    .pn-ivory-card {
      background: var(--pn-ivory); color: var(--pn-ink); border-radius: 16px;
      padding: 28px 20px; border: 1px solid rgba(181,148,87,.35);
      box-shadow: 0 12px 30px rgba(74,93,112,.12);
    }
    .pn-stay-grid { display: grid; gap: 18px; margin-top: 24px; }
    .pn-stay-card {
      background: #fffdf9; border-radius: 18px; padding: 24px 20px; text-align: center;
      border: 2px solid rgba(181,148,87,.3);
      box-shadow: 0 0 0 4px #f1ebe0, 0 10px 26px rgba(74,93,112,.08);

    .pn-stay-meta { display: grid; gap: 6px; margin: 12px 0 16px; font-size: 12px; }
    .pn-stay-meta strong { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--pn-gold); display: block; }

    /* 9. Interactive Openable RSVP Envelope */
    .pn-rsvp-env {
      max-width: 370px; margin: 24px auto 0; background: var(--pn-ivory); color: var(--pn-ink);

    .pn-rsvp-flap {
      padding: 36px 20px 28px; cursor: pointer; position: relative;

      border-bottom: 1px dashed rgba(74,93,112,.25); transition: all .35s ease;

    .pn-rsvp-env.open .pn-rsvp-tap { display: none; }
    .pn-field { margin-bottom: 16px; }
    .pn-field label { display: block; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; color: var(--pn-ink); }
    .pn-field input, .pn-field textarea {
      width: 100%; padding: 10px 12px; border: 1px solid rgba(74,93,112,.3); border-radius: 8px;
      background: #fff; color: var(--pn-ink); font-family: inherit; font-size: 13.5px; outline: none;

    .pn-field input:focus, .pn-field textarea:focus { border-color: var(--pn-gold); }
    .pn-pearl-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pn-pearl-opt {

    .pn-pearl-opt.active { border-color: var(--pn-ink); background: #eef3f6; font-weight: 600; }

    .pn-stepper { display: inline-flex; align-items: center; gap: 14px; background: #fff; border: 1px solid rgba(74,93,112,.25); border-radius: 999px; padding: 5px 12px; }
    .pn-stepper button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--pn-ink); background: transparent; color: var(--pn-ink); font-size: 16px; line-height: 1; cursor: pointer; }
    .pn-stepper span { font-size: 13px; font-weight: 600; min-width: 78px; text-align: center; }

    /* Standalone Envelope Overlay (when no custom cover photo is uploaded) */
    .pn-env-overlay {
      position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; overflow: hidden;
      background: linear-gradient(155deg, #f8f3eb 0%, #ebf1f4 50%, #f7efe8 100%);
      transition: opacity 1s ease, visibility 1s ease;
    }
    .pn-env-overlay.opened { opacity: 0; visibility: hidden; pointer-events: none; }
    .pn-env-wing {
      position: absolute; top: 0; bottom: 0; width: 52%;

        radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(235,227,214,.85) 55%, rgba(212,223,230,.75) 100%);
      box-shadow: 0 0 40px rgba(74,93,112,.16);
      transition: transform 1.05s cubic-bezier(.65,0,.35,1);
    }
    .pn-env-wing.left { left: 0; border-right: 1px solid rgba(181,148,87,.35); border-radius: 0 44% 44% 0 / 0 50% 50% 0; }
    .pn-env-wing.right { right: 0; border-left: 1px solid rgba(181,148,87,.35); border-radius: 44% 0 0 44% / 50% 0 0 50%; }
    .pn-env-overlay.opening .pn-env-wing.left { transform: translateX(-105%); }
    .pn-env-overlay.opening .pn-env-wing.right { transform: translateX(105%); }
    .pn-env-center { position: relative; z-index: 2; text-align: center; transition: opacity .45s ease, transform .45s ease; }
    .pn-env-overlay.opening .pn-env-center { opacity: 0; transform: scale(1.12); }


    .pn-hero-full {
      position: relative; min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 48px 24px; overflow: hidden;
      background: var(--pn-ivory);
    }
    .pn-hero-frame-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      pointer-events: none; user-select: none; z-index: 1;
    }
    .pn-hero-content {

    .pn-cd-framed {

      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;

      else { audioBtn.style.display = 'none'; }

      overlay.hidden = false;

      let started = false, ended = false, timer = null, wantAudio = !!audSrc;
      function syncIcons() {
        iPlay.style.display = audio.paused ? 'block' : 'none';
        iPause.style.display = audio.paused ? 'none' : 'block';
      }
      audio.addEventListener('play', syncIcons);
      audio.addEventListener('pause', syncIcons);

      function tryPlayAudio() {
        if (!audSrc || !wantAudio) return;
        audio.muted = false;
        audio.volume = 1;
        const p = audio.play();
        if (p && p.then) p.then(syncIcons).catch(syncIcons);
      }

      // Desbloquear audio al primer toque (iOS Safari / Android Chrome / Brave)
      function primeAudio() {
        if (!audSrc || started) return;
        const p = audio.play();
        if (p && p.then) p.then(() => { if (!started) { audio.pause(); audio.currentTime = 0; } }).catch(() => {});
      }

      function finish() {
        if (ended) return; ended = true; clearTimeout(timer);
        videoWrap.classList.remove('wei-video-in');
        videoWrap.classList.add('wei-video-out');
        setTimeout(() => { videoWrap.style.display = 'none'; }, 1000);
        document.body.classList.remove('locked');
        dock.classList.add('visible');

        document.querySelectorAll('.hero-delay').forEach(el => el.classList.add('is-visible'));

        if (started) return; started = true;

          video.currentTime = 0;

        }

        if (started && wantAudio && audio.paused) tryPlayAudio();

      video.addEventListener('timeupdate', () => {

      video.addEventListener('ended', finish);

      audioBtn.addEventListener('click', (ev) => {

        if (audio.paused) { wantAudio = true; tryPlayAudio(); }

        }

      $('repeatBtn').addEventListener('click', (ev) => {
        ev.stopPropagation();

        overlay.style.display = 'flex'; overlay.style.opacity = '1'; overlay.style.pointerEvents = 'auto';

    function wireRsvpModal() {
      const close = () => $('rsvpModal').classList.remove('is-open');
      $('closeRsvp').addEventListener('click', close);
      $('doneRsvp').addEventListener('click', close);
      $('rsvpModal').addEventListener('click', e => { if (e.target === $('rsvpModal')) close(); });

        e.preventDefault();
        const name = $('inName').value.trim(), guests = $('inGuests').value.trim(), kids = $('inKids').value.trim();
        const att = document.querySelector('input[name="att"]:checked');
        ['eName', 'eAtt', 'eGuests', 'eKids'].forEach(id => $(id).classList.remove('on'));
        let ok = true;
        if (!name) { $('eName').classList.add('on'); ok = false; }
        if (!att) { $('eAtt').classList.add('on'); ok = false; }
        if (!guests) { $('eGuests').classList.add('on'); ok = false; }
        if (!kids) { $('eKids').classList.add('on'); ok = false; }
        if (!ok) return;
        $('rsvpOkText').textContent = att.value === 'Accepts with pleasure'
          ? ('Thank you, ' + name + '! We are delighted you will join us (' + guests + ' guest(s)).')
          : ('Thank you for letting us know, ' + name + '. You will be warmly missed.');
        $('rsvpFormWrap').hidden = true;
        $('rsvpOkWrap').hidden = false;
      });
    }

    function initObservers() {
      const els = document.querySelectorAll('.anim-fadein, .anim-fadeinup, .anim-zoomin');
      if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('is-visible')); return; }
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (en.isIntersecting && !en.target.classList.contains('hero-delay')) {
            en.target.classList.add('is-visible'); io.unobserve(en.target);
          }
        });
      }, { threshold: .15 });
      els.forEach(e => { if (!e.classList.contains('hero-delay')) io.observe(e); });
    }

        '</div></div>';

      // Revelado suave de la portada
      const revealHero = () => { const hc = $('pnHeroContent'); if (hc) hc.classList.remove('pn-wait'); };
      const builtin = $('pnBuiltinEnv');
      if (builtin) {
        document.body.classList.add('locked');
        builtin.addEventListener('click', () => {
          builtin.classList.add('opening');
          const a = $('weiAudio'); if (a && a.src) a.play().catch(() => {});
          setTimeout(() => { builtin.classList.add('opened'); document.body.classList.remove('locked'); revealHero(); }, 750);
        });
      } else {
        setTimeout(revealHero, 300);
      }

      // Observador de scroll suave para las secciones
      const fades = document.querySelectorAll('.pn-scroll-fade');
      if ('IntersectionObserver' in window) {
        const io2 = new IntersectionObserver(es => {
          es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('is-visible'); io2.unobserve(en.target); } });
        }, { threshold: .12 });
        fades.forEach(el => io2.observe(el));
      } else {
        fades.forEach(el => el.classList.add('is-visible'));
      }

      // Raspadita real en Canvas
      const cv = $('pnScratchCanvas');
      if (cv) {
        const cx = cv.getContext('2d');
        const gr = cx.createLinearGradient(0, 0, cv.width, cv.height);
        gr.addColorStop(0, '#f7efe3'); gr.addColorStop(.5, '#e8dfd1'); gr.addColorStop(1, '#f3ebe0');
        cx.fillStyle = gr; cx.fillRect(0, 0, cv.width, cv.height);
        cx.fillStyle = '#8b7355'; cx.font = 'italic 22px Georgia, serif'; cx.textAlign = 'center';
        cx.fillText('Raspa para', cv.width / 2, cv.height / 2 - 8);
        cx.fillText('descubrir', cv.width / 2, cv.height / 2 + 20);
        let down = false;
        const rub = (e) => {
          const r = cv.getBoundingClientRect();
          cx.globalCompositeOperation = 'destination-out';
          cx.beginPath();
          cx.arc((e.clientX - r.left) * (cv.width / r.width), (e.clientY - r.top) * (cv.height / r.height), 24, 0, Math.PI * 2);
          cx.fill();
        };
        cv.addEventListener('pointerdown', e => { down = true; rub(e); });
        cv.addEventListener('pointermove', e => { if (down) rub(e); });
        window.addEventListener('pointerup', () => down = false);
      }
      // Sobre desplegable de confirmación
      const envEl = $('pnRsvpEnv'), flapEl = $('pnRsvpFlap');
      if (flapEl && envEl) flapEl.addEventListener('click', () => envEl.classList.toggle('open'));
      document.querySelectorAll('.pn-pearl-opts').forEach(g => {
        g.addEventListener('click', e => {
          const o = e.target.closest('.pn-pearl-opt'); if (!o) return;
          g.querySelectorAll('.pn-pearl-opt').forEach(x => x.classList.remove('active'));
          o.classList.add('active');
        });
      });
      const formEl = $('pnRsvpForm');
      if (formEl) {
        formEl.addEventListener('submit', e => {
          e.preventDefault();
          if (isDemo) { alert('Esta invitación es una demo. Tu respuesta no se guarda.'); return; }
          if (d.googleFormUrl) { window.open(d.googleFormUrl, '_blank', 'noopener'); return; }
          const nm = ($('pnName')?.value || '').trim();
          const as = document.querySelector('[data-group="asiste"] .active')?.dataset.val || 'Sí, asistiré';
          const pl = document.querySelector('[data-group="plus"] .active')?.dataset.val || 'Solo yo';
          const nt = ($('pnNote')?.value || '').trim();
          const msg = 'Hola, confirmo asistencia para ' + (n1 + (n2 ? ' & ' + n2 : '')) + ': ' + nm + ' — ' + as + ' (' + pl + ')' + (nt ? '. Nota: ' + nt : '');
          if (waNum) window.open('https://wa.me/' + waNum + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
          else alert('La confirmación aún no está habilitada para este evento.');
        });
      }
    }

    function renderAll(payload) {
      const d = payload.datos || {}, t = payload.plantilla || {};
      const m = Object.assign({}, t.media || {});
      Object.entries(d.medios || {}).forEach(([k, v]) => { if (v) m[k] = v; });
      const c = d.colores || {};
      const bg = c.fondo || t.fondo || '#f9f0e0';
      let ink = c.texto || t.texto || '#6c513f';
      let accent = c.acento || t.acento || '#a67d2b';
      const btnBg = c.boton || t.boton || '#5a0f1b';
      if (ink.toLowerCase() === bg.toLowerCase()) ink = t.texto && t.texto.toLowerCase() !== bg.toLowerCase() ? t.texto : '#6c513f';
      if (accent.toLowerCase() === bg.toLowerCase()) accent = t.acento && t.acento.toLowerCase() !== bg.toLowerCase() ? t.acento : '#a67d2b';

      document.documentElement.style.setProperty('--bg', bg);
      document.documentElement.style.setProperty('--ink', ink);
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--btn-bg', btnBg);
      const fontMap = {
        'Cormorant Garamond': "'Cormorant Garamond', Georgia, serif",
        'Playfair Display': "'Playfair Display', Georgia, serif",
        'Great Vibes': "'Great Vibes', 'Cormorant Garamond', cursive",
        'Cinzel': "'Cinzel', Georgia, serif",
        'Ovo': "'Ovo', Georgia, serif"
      };
      const activeFont = d.fuente || t.fuente || 'Cormorant Garamond';
      if (fontMap[activeFont]) {
        document.documentElement.style.setProperty('--font-display', fontMap[activeFont]);
      }
      document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
      document.title = (d.nombre1 || 'Invitación') + (d.nombre2 ? ' & ' + d.nombre2 : '') + ' · N&S ATELIER';

      if (t.estilo === 'sacred-garden' || t.id === 'the-sacred-garden') renderSacredGarden(d, t, m);
      else if (t.estilo === 'perla-nacar' || t.id === 'perla-nacar') renderPerlaNacar(d, t, m, payload.tipo === 'plantilla');
      else renderUniversal(d, t, m);

      setupIntro(m, d.textos || {});
      startCountdown(d.fecha);
      wireRsvpModal();
      initObservers();
      $('loading').classList.add('hidden');
    }

    async function loadInvitation(query) {
      return query ? window.consultarPanel(query) : FALLBACK_SAMPLE;
    }

    (async () => {
      const q = getQuery();
      try {
        const data = await loadInvitation(q);
        if (!data || !data.ok) throw Error(data?.error || 'Invitación no encontrada');
        renderAll(data);
      } catch (err) {
        showError(err.message + (q?.tipo === 'evento' ? ' Verifica que la invitación esté en estado "Publicada".' : ''));
      }
    })();
  </script>
</body>
</html>
