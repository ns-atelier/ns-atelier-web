<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex,nosnippet" />
  <meta name="theme-color" content="#f9f0e0" />
  <title>Invitación especial · N&amp;S ATELIER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Ovo&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f9f0e0;
      --ink: #6c513f;
      --accent: #a67d2b;
      --btn-bg: #5a0f1b;
      --line: rgba(156, 133, 117, .32);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-ovo: 'Ovo', Georgia, serif;
      --font-cinzel: 'Cinzel', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background: var(--bg); overflow-x: hidden; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-display); overflow-x: hidden; }
    body.locked { overflow: hidden; }
    [hidden] { display: none !important; }
    img { display: block; max-width: 100%; }
    button { font: inherit; cursor: pointer; }

    /* Loading & Error */
    #loading { position: fixed; inset: 0; z-index: 200000; background: var(--bg); display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px; font: 20px Georgia, serif; color: var(--ink); }
    #loading.hidden { display: none; }
    .errBox { max-width: 420px; background: #fffaf3; border: 1px solid #e5d5c1; border-radius: 14px; padding: 26px; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.6; }
    .errBox h2 { font-family: Georgia, serif; margin-bottom: 10px; color: var(--accent); }
    .errBox a { display: inline-block; margin-top: 14px; color: var(--btn-bg); font-weight: 600; }

    /* =====================================================================
       ENVELOPE OVERLAY & VIDEO (SHARED)
    ===================================================================== */
    #weiOverlay { position: fixed; inset: 0; z-index: 99999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; transition: opacity 1.3s ease; }
    #weiImg { width: 100%; max-width: 440px; max-height: 86vh; object-fit: contain; }
    #weiTapWrap { position: absolute; bottom: 28%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 7px; }
    #weiTapLabel { font-family: var(--font-cinzel); font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: rgba(140, 100, 60, .82); animation: weiPulse 2.4s ease-in-out infinite; white-space: nowrap; background: rgba(249, 240, 224, .75); padding: 4px 12px; border-radius: 999px; }
    .wei-chevron { width: 10px; height: 10px; border-right: 1.5px solid rgba(140, 100, 60, .65); border-top: 1.5px solid rgba(140, 100, 60, .65); transform: rotate(-45deg); animation: weiChev 2.4s ease-in-out infinite; }
    @keyframes weiPulse { 0%, 100% { opacity: .55; letter-spacing: .26em; } 50% { opacity: 1; letter-spacing: .30em; } }
    @keyframes weiChev { 0%, 100% { transform: rotate(-45deg) translate(0, 0); } 50% { transform: rotate(-45deg) translate(2px, -2px); } }

    #weiVideoWrap { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center; background: var(--bg); opacity: 0; transition: opacity .7s ease; pointer-events: none; }
    #weiVideoWrap.wei-video-in { opacity: 1; pointer-events: all; }
    #weiVideoWrap.wei-video-out { opacity: 0; transition: opacity 1.2s ease; }
    #weiVideo { width: 100%; max-width: 440px; max-height: 100vh; object-fit: contain; }
    #skipVideoBtn { position: absolute; bottom: 26px; right: 20px; border: 1px solid rgba(140, 100, 60, .4); background: rgba(255, 250, 242, .85); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 12px system-ui, sans-serif; }

    #weiAudioBtn { position: fixed; bottom: 20px; right: 20px; width: 58px; height: 58px; background: var(--btn-bg); border: none; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 90000; box-shadow: 0 4px 14px rgba(90, 15, 27, .28); visibility: hidden; opacity: 0; transition: opacity .35s ease, transform .2s ease; }
    #weiAudioBtn:hover { transform: scale(1.06); }
    #weiAudioBtn svg { width: 26px; height: 26px; fill: #fff; }

    /* =====================================================================
       ENGINE A: THE SACRED GARDEN (100% EDITABLE FROM PANEL)
    ===================================================================== */
    .sg-page { width: 100%; min-height: 100vh; background: var(--bg); overflow-x: hidden; }
    .sg-artboard { position: relative; width: 100%; max-width: 450px; margin: 0 auto; background: var(--bg); }

    .anim-fadein { opacity: 0; transition: opacity 1.1s ease; }
    .anim-fadein.is-visible { opacity: 1; }
    .anim-fadeinup { opacity: 0; transform: translateY(28px); transition: opacity 1.3s ease, transform 1.3s ease; }
    .anim-fadeinup.is-visible { opacity: 1; transform: translateY(0); }
    .anim-zoomin { opacity: 0; transform: scale(.92); transition: opacity 1.1s ease, transform 1.1s ease; }
    .anim-zoomin.is-visible { opacity: 1; transform: scale(1); }

    .sg-hero { height: 1240px; overflow: hidden; }
    .sg-hero-video { position: absolute; top: 0; left: 0; width: 100%; height: 762px; z-index: 1; overflow: hidden; }
    .sg-hero-video video { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .sg-hero-glow { position: absolute; top: 0; left: 0; width: 100%; height: 676px; z-index: 2; opacity: .5; background-image: radial-gradient(circle at center, rgba(255, 249, 235, 1) 0%, rgba(255, 231, 192, 0) 85%); pointer-events: none; }
    .sg-type { position: absolute; top: 154px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 40px; line-height: .95; font-weight: 300; }
    .sg-date { position: absolute; top: 198px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 25px; font-weight: 600; letter-spacing: .08em; }
    .sg-names { position: absolute; top: 288px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 74px; line-height: .75; font-weight: 700; }
    .sg-names .sg-amp { display: block; font-size: 40px; font-weight: 300; font-style: italic; line-height: 1.25; }
    .sg-scroll-lbl { position: absolute; top: 518px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 30px; font-weight: 300; text-decoration: none; }
    .sg-scroll-chev { position: absolute; top: 558px; left: 50%; width: 25px; margin-left: -12.5px; z-index: 4; animation: sgBounce 1.1s ease-in-out infinite; }
    @keyframes sgBounce { 0%, 100% { transform: translateY(0); } 54% { transform: translateY(5px); } }

    .sg-branch-l { position: absolute; top: 566px; left: -16px; width: 224px; z-index: 3; pointer-events: none; transform-origin: bottom left; animation: swayL 4s ease-in-out infinite; }
    .sg-branch-r { position: absolute; top: 547px; right: -16px; width: 236px; z-index: 3; pointer-events: none; transform-origin: bottom right; animation: swayR 4s ease-in-out infinite; }
    @keyframes swayL { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.06) rotate(2deg); } }
    @keyframes swayR { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.04) rotate(-2deg); } }

    .sg-welcome-bg { position: absolute; top: 753px; left: 50%; transform: translateX(-50%); width: 744px; height: 487px; z-index: 2; pointer-events: none; }
    .sg-welcome-bg img { width: 100%; height: 100%; object-fit: fill; }
    .sg-calig { position: absolute; top: 813px; left: 50%; transform: translateX(-50%); width: 280px; max-height: 90px; object-fit: contain; z-index: 4; }
    .sg-quote { position: absolute; top: 902px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; text-align: center; z-index: 4; color: var(--accent); font-size: 36px; line-height: 1.08; font-weight: 300; white-space: pre-line; }
    .sg-msg { position: absolute; top: 1048px; left: 50%; transform: translateX(-50%); width: 315px; max-width: 88%; text-align: center; z-index: 4; color: var(--ink); font-size: 20px; line-height: 1.28; white-space: pre-line; }

    .sg-title { color: var(--accent); font-family: var(--font-display); font-size: 39px; line-height: 1.2; font-weight: 300; text-align: center; }

    /* Countdown */
    .sg-countdown { padding: 26px 12px 34px; text-align: center; }
    .sg-cd-row { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 20px auto 8px; }
    .sg-tb { text-align: center; min-width: 66px; }
    .sg-num { font-size: 44px; font-family: var(--font-ovo); line-height: 1.15; background: linear-gradient(105deg, var(--accent) 0%, #d8ba72 52%, var(--accent) 100%); background-size: 260% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 4.5s ease-in-out infinite; }
    @keyframes shimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }
    .sg-lbl { font-size: 17px; margin-top: 5px; color: var(--accent); font-family: var(--font-ovo); opacity: .85; }
    .sg-sep { font-size: 46px; margin-top: -32px; color: var(--accent); font-family: var(--font-ovo); opacity: .85; }

    /* Schedule */
    .sg-schedule { position: relative; padding: 42px 16px 56px; overflow: hidden; min-height: 540px; }
    .sg-sched-bg1 { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 744px; height: 346px; z-index: 1; pointer-events: none; }
    .sg-sched-bg2 { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 744px; height: 259px; z-index: 1; pointer-events: none; }
    .sg-sched-bg1 img, .sg-sched-bg2 img { width: 100%; height: 100%; object-fit: fill; }
    .sg-sched-head { position: relative; z-index: 4; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 36px; }
    .sg-sched-head img { width: 68px; flex-shrink: 0; }
    .sg-timeline { position: relative; z-index: 4; max-width: 360px; margin: 0 auto; padding: 8px 0; }
    .sg-timeline::before { content: ''; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 1px; background: #9c8575; opacity: .7; transform: translateX(-50%); }
    .sg-rose { position: absolute; top: 0; left: 50%; width: 52px; margin-left: -26px; z-index: 5; pointer-events: none; transform: translateY(0px) rotate(325deg); transition: transform .12s linear; }
    .sg-row { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; padding: 17px 0; position: relative; }
    .sg-row-time { text-align: right; padding-right: 18px; color: #846f61; font-size: 28px; font-weight: 600; }
    .sg-diamond { width: 8px; height: 8px; background: #8c7666; transform: rotate(45deg); margin: 0 auto; }
    .sg-row-name { text-align: left; padding-left: 18px; color: var(--ink); font-size: 20px; line-height: 1.15; }
    .sg-row-name small { display: block; font-size: 14px; opacity: .75; margin-top: 2px; }

    /* Location & Petals */
    .sg-location { padding: 30px 16px 20px; text-align: center; overflow: hidden; }
    .sg-loc-decor { width: 96px; margin: 6px auto 4px; }
    .sg-venue { font-size: 22px; font-weight: 500; margin-top: 6px; }
    .sg-addr { font-size: 18px; line-height: 1.3; max-width: 310px; margin: 4px auto 10px; }
    .sg-venue-art { width: 370px; max-width: 92%; margin: 6px auto 0; }
    .sg-petal { position: absolute; z-index: 5; pointer-events: none; opacity: 0; }
    .sg-location.petals-on .p1 { top: 45px; right: 24px; width: 40px; animation: pf1 8s ease-in-out infinite; }
    .sg-location.petals-on .p2 { top: 40px; left: 54px; width: 42px; animation: pf2 8.5s .4s ease-in-out infinite; }
    .sg-location.petals-on .p3 { top: 150px; left: 16px; width: 40px; animation: pf1 9s .8s ease-in-out infinite; }
    .sg-location.petals-on .p4 { top: 170px; right: 16px; width: 36px; animation: pf2 8s 1.2s ease-in-out infinite; }
    @keyframes pf1 { 0% { opacity: 0; transform: translate(0, 0) rotate(0deg); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(55px, 280px) rotate(-10deg); } }
    @keyframes pf2 { 0% { opacity: 0; transform: translate(0, 0) rotate(180deg); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-55px, 280px) rotate(200deg); } }

    /* Map */
    .sg-map { padding: 34px 0 56px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .sg-map-frame { position: relative; width: 341px; max-width: 92vw; height: 341px; display: flex; align-items: center; justify-content: center; }
    .sg-map-border { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .8; transform: rotate(180deg); pointer-events: none; z-index: 1; }
    .sg-map-iframe { position: relative; z-index: 2; width: 335px; max-width: calc(92vw - 6px); height: 335px; border: 0; border-radius: 15px; }
    .sg-map-top { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); width: 190px; z-index: 3; pointer-events: none; }
    .sg-map-bot { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); width: 190px; z-index: 3; pointer-events: none; }
    .sg-map-link { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-family: var(--font-ovo); font-size: 14px; }

    /* Dress Code & Gifts */
    .sg-dg { height: 491px; overflow: hidden; text-align: center; }
    .sg-dg-bg { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 744px; height: 453px; z-index: 1; pointer-events: none; }
    .sg-dg-bg img { width: 100%; height: 100%; object-fit: fill; }
    .sg-dg-r { position: absolute; top: 9px; right: -135px; width: 305px; z-index: 2; pointer-events: none; animation: swayR 7s ease-in-out infinite; }
    .sg-dg-l { position: absolute; top: 264px; left: -82px; width: 251px; z-index: 2; pointer-events: none; transform: rotate(274deg); }
    .sg-dg-inner { position: relative; z-index: 4; padding-top: 86px; }
    .sg-dg-text { margin: 12px auto 0; max-width: 305px; font-size: 21px; line-height: 1.28; }

    /* RSVP Section */
    .sg-rsvp { padding: 48px 16px 38px; text-align: center; }
    .sg-rsvp-desc { margin: 14px auto 0; max-width: 360px; font-size: 21px; line-height: 1.28; }
    .sg-seal-btn { margin-top: 22px; background: transparent; border: none; padding: 0; transition: transform .25s ease; }
    .sg-seal-btn:hover { transform: scale(1.05); }
    .sg-seal-btn img { width: 190px; margin: 0 auto; }
    .sg-click-cue { margin-top: 10px; display: inline-flex; flex-direction: column; align-items: center; cursor: pointer; animation: sgBounce 1.1s ease-in-out infinite; }
    .sg-click-cue span { color: var(--accent); font-size: 29px; font-weight: 300; }
    .sg-rsvp-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .sg-pill-btn { padding: 11px 22px; border-radius: 999px; background: var(--btn-bg); color: #f9f0e0; text-decoration: none; font-family: var(--font-ovo); font-size: 15px; border: 1px solid var(--btn-bg); }
    .sg-pill-btn.outline { background: transparent; color: var(--btn-bg); }

    /* Footer */
    .sg-footer { height: 673px; overflow: hidden; }
    .sg-footer-photo { position: absolute; top: 0; left: 0; width: 100%; height: 675px; object-fit: cover; z-index: 1; }
    .sg-footer-grad { position: absolute; top: 0; left: 0; width: 100%; height: 237px; background-image: linear-gradient(0turn, rgba(232, 221, 207, 0) 0%, var(--bg) 100%); z-index: 2; pointer-events: none; }
    .sg-footer-title { position: absolute; top: 14px; left: 0; width: 100%; z-index: 4; }
    .sg-footer-names { position: absolute; top: 72px; left: 0; width: 100%; text-align: center; z-index: 4; color: var(--accent); font-size: 28px; }
    .sg-footer-wreath { position: absolute; top: 173px; left: 50%; width: 537px; margin-left: -268.5px; z-index: 3; pointer-events: none; animation: swayR 4.5s ease-in-out infinite; }

    /* RSVP Modal */
    .rsvp-backdrop { position: fixed; inset: 0; z-index: 100001; background: rgba(0, 0, 0, .62); display: flex; align-items: center; justify-content: center; padding: 18px; opacity: 0; visibility: hidden; transition: .3s; }
    .rsvp-backdrop.is-open { opacity: 1; visibility: visible; }
    .rsvp-close { position: fixed; top: 18px; right: 20px; width: 40px; height: 40px; background: transparent; border: none; color: #fff; font-size: 28px; z-index: 100002; }
    .rsvp-dialog { width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; background: #fffaf8; border-radius: 6px; padding: 34px 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, .28); font-family: var(--font-ovo); color: #4f4f4f; }
    .rsvp-dialog h3 { text-align: center; font-size: 23px; font-weight: 400; margin-bottom: 6px; }
    .rsvp-dialog .sub { text-align: center; font-size: 15px; color: #777; margin-bottom: 22px; }
    .rsvp-field { margin-bottom: 16px; }
    .rsvp-field label { display: block; font-size: 15px; margin-bottom: 6px; }
    .rsvp-field input[type="text"] { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #c9c9c9; border-radius: 5px; font: 15px var(--font-ovo); }
    .rsvp-radios { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
    .rsvp-radios label { display: flex; align-items: center; gap: 9px; margin: 0; cursor: pointer; }
    .rsvp-submit { width: 100%; height: 52px; margin-top: 8px; background: var(--btn-bg); color: #f6f1e8; border: none; border-radius: 20px; font: 19px var(--font-ovo); }
    .rsvp-err { color: #b91c1c; font-size: 12.5px; margin-top: 4px; display: none; }
    .rsvp-err.on { display: block; }

    /* =====================================================================
       ENGINE B: CLASSIC N&S ATELIER TEMPLATES
    ===================================================================== */
    .cl-wrap { max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--bg); box-shadow: 0 20px 60px rgba(70, 62, 55, .14); text-align: center; }
    .cl-sec { padding: 56px 28px; border-bottom: 1px solid var(--line); }
    .cl-kicker { font: 10px system-ui, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); }
    .cl-names { font-size: clamp(44px, 11vw, 68px); font-weight: 400; color: var(--ink); margin: 16px 0; line-height: 1.1; }
    .cl-names span { display: block; font-style: italic; color: var(--accent); font-size: 36px; }
    .cl-h2 { font-size: 34px; font-weight: 400; margin: 12px 0 14px; color: var(--accent); }
    .cl-p { font-size: 17px; line-height: 1.75; max-width: 390px; margin: 8px auto; white-space: pre-line; }
    .cl-orn { width: 165px; margin: 12px auto 20px; opacity: .75; }
    .cl-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 22px; }
    .cl-gallery img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; }
    .cl-gallery img:nth-child(3) { grid-column: 1 / -1; aspect-ratio: 16/9; }

    @media (max-width: 410px) {
      .sg-names { font-size: 62px; }
      .sg-quote { font-size: 31px; }
      .sg-title { font-size: 33px; }
      .sg-num { font-size: 36px; }
      .sg-tb { min-width: 54px; }
      .sg-row-time { font-size: 24px; }
      .sg-row-name { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status">Preparando tu invitación…</div>

  <!-- Audio & Opening Sequence -->
  <audio id="weiAudio" loop preload="auto"></audio>

  <div id="weiOverlay" hidden role="button" tabindex="0" aria-label="Tap to open">
    <img id="weiImg" alt="Open your invitation" draggable="false" />
    <div id="weiTapWrap">
      <div class="wei-chevron"></div>
      <div id="weiTapLabel">Tap to open</div>
    </div>
  </div>

  <div id="weiVideoWrap" aria-hidden="true">
    <video id="weiVideo" muted playsinline preload="auto"></video>
    <button type="button" id="skipVideoBtn">Saltar ›</button>
  </div>

  <button id="weiAudioBtn" type="button" aria-label="Pausar o reproducir música">
    <svg id="weiIconPause" viewBox="0 0 24 24" style="display:block"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    <svg id="weiIconPlay" viewBox="0 0 24 24" style="display:none"><polygon points="5,3 19,12 5,21"/></svg>
  </button>

  <div id="root"></div>

  <!-- RSVP Modal (Sacred Garden) -->
  <div class="rsvp-backdrop" id="rsvpModal" role="dialog" aria-modal="true">
    <button type="button" class="rsvp-close" id="closeRsvp" aria-label="Cerrar">&times;</button>
    <div class="rsvp-dialog">
      <div id="rsvpFormWrap">
        <h3>Confirm Your Attendance</h3>
        <div class="sub" id="rsvpModalSub">Please RSVP before August 09</div>
        <form id="rsvpForm" novalidate>
          <div class="rsvp-field">
            <label for="inName">Your name</label>
            <input type="text" id="inName" required />
            <div class="rsvp-err" id="eName">Please enter your name.</div>
          </div>
          <div class="rsvp-field">
            <label>Will you be attending?</label>
            <div class="rsvp-radios">
              <label><input type="radio" name="att" value="Accepts with pleasure" required /> Accepts with pleasure</label>
              <label><input type="radio" name="att" value="Declines with regret" required /> Declines with regret</label>
            </div>
            <div class="rsvp-err" id="eAtt">Please select an option.</div>
          </div>
          <div class="rsvp-field">
            <label for="inGuests">Number of Guests Attending</label>
            <input type="text" id="inGuests" required />
            <div class="rsvp-err" id="eGuests">Please enter number of guests.</div>
          </div>
          <div class="rsvp-field">
            <label for="inSong">A Song That Gets You Dancing</label>
            <input type="text" id="inSong" />
          </div>
          <div class="rsvp-field">
            <label for="inKids">Children Attending (names &amp; ages)</label>
            <input type="text" id="inKids" required />

        let done = false;
        const finish = (err, data) => {

        s.src = API_URL + (API_URL.includes('?') ? '&' : '?') + new URLSearchParams({ ...query, callback: name }).toString();

        const dist = target - new Date();
        if (dist <= 0) { dEl.textContent = '0'; hEl.textContent = '00'; mEl.textContent = '00'; sEl.textContent = '00'; return; }
        dEl.textContent = String(Math.floor(dist / 86400000));
        hEl.textContent = String(Math.floor((dist % 86400000) / 3600000)).padStart(2, '0');
        mEl.textContent = String(Math.floor((dist % 3600000) / 60000)).padStart(2, '0');
        sEl.textContent = String(Math.floor((dist % 60000) / 1000)).padStart(2, '0');
      }
      tick(); setInterval(tick, 1000);

            <div class="sg-tb"><div class="sg-num" id="cdHours">--</div><div class="sg-lbl">Horas</div></div>
            <div class="sg-sep">:</div>
            <div class="sg-tb"><div class="sg-num" id="cdMins">--</div><div class="sg-lbl">Min</div></div>
            <div class="sg-sep">:</div>
            <div class="sg-tb"><div class="sg-num" id="cdSecs">--</div><div class="sg-lbl">Seg</div></div>
          </div>
        </section>
        ${sched.length ? `<section class="cl-sec anim-fadein">
          <h2 class="cl-h2">Programa</h2>
          ${sched.map(x => `<p class="cl-p"><b>${esc(x.hora)}</b> · ${esc(x.nombre)} ${x.detalle ? '— ' + esc(x.detalle) : ''}</p>`).join('')}
        </section>` : ''}
        ${photos.length ? `<section class="cl-sec anim-fadein"><h2 class="cl-h2">Nuestros recuerdos</h2><div class="cl-gallery">${photos.map(u => `<img src="${esc(u)}" loading="lazy" alt="">`).join('')}</div></section>` : ''}
        <section class="cl-sec anim-fadein">
          <h2 class="cl-h2">${esc(d.lugar || 'Ubicación')}</h2>
          ${safeUrl(m.lugar) ? `<img class="sg-venue-art" src="${esc(safeUrl(m.lugar))}" alt="">` : ''}
          <p class="cl-p">${esc(d.direccion || '')}</p>
          ${mapUrl ? `<p style="margin-top:16px"><a class="sg-pill-btn" href="${esc(mapUrl)}" target="_blank" rel="noopener noreferrer">Cómo llegar ↗</a></p>` : ''}
        </section>
        <section class="cl-sec anim-fadein">
          <h2 class="cl-h2">Detalles</h2>
          ${d.vestimenta ? `<p class="cl-p"><b>Vestimenta:</b> ${esc(d.vestimenta)}</p>` : ''}
          ${d.regalos ? `<p class="cl-p"><b>Regalos:</b> ${esc(d.regalos)}</p>` : ''}
        </section>
        <section class="cl-sec anim-fadein">
          <h2 class="cl-h2">Confirma tu asistencia</h2>
          <div class="sg-rsvp-links">
            ${gForm ? `<a class="sg-pill-btn" href="${esc(gForm)}" target="_blank" rel="noopener noreferrer">Confirmar con formulario</a>` : ''}
            ${waLink ? `<a class="sg-pill-btn outline" href="${esc(waLink)}" target="_blank" rel="noopener noreferrer">Confirmar por WhatsApp</a>` : ''}
          </div>
          <p class="cl-p" style="margin-top:24px;color:var(--accent)">${esc(d.despedida || '¡Te esperamos!')}</p>
        </section>
      </main>`;
    }

    function wireRsvpModal() {
      const close = () => $('rsvpModal').classList.remove('is-open');
      $('closeRsvp').addEventListener('click', close);
      $('doneRsvp').addEventListener('click', close);
      $('rsvpModal').addEventListener('click', e => { if (e.target === $('rsvpModal')) close(); });
      $('rsvpForm').addEventListener('submit', e => {
        e.preventDefault();
        const name = $('inName').value.trim(), guests = $('inGuests').value.trim(), kids = $('inKids').value.trim();
        const att = document.querySelector('input[name="att"]:checked');
        ['eName', 'eAtt', 'eGuests', 'eKids'].forEach(id => $(id).classList.remove('on'));
        let ok = true;
        if (!name) { $('eName').classList.add('on'); ok = false; }
        if (!att) { $('eAtt').classList.add('on'); ok = false; }
        if (!guests) { $('eGuests').classList.add('on'); ok = false; }
        if (!kids) { $('eKids').classList.add('on'); ok = false; }
        if (!ok) return;
        $('rsvpOkText').textContent = att.value === 'Accepts with pleasure'
          ? ('Thank you, ' + name + '! We are delighted you will join us (' + guests + ' guest(s)).')
          : ('Thank you for letting us know, ' + name + '. You will be warmly missed.');
        $('rsvpFormWrap').hidden = true;
        $('rsvpOkWrap').hidden = false;
      });
    }

    function initObservers() {
      const els = document.querySelectorAll('.anim-fadein, .anim-fadeinup, .anim-zoomin');
      if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('is-visible')); return; }
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (en.isIntersecting && !en.target.classList.contains('hero-delay')) {
            en.target.classList.add('is-visible'); io.unobserve(en.target);
          }
        });
      }, { threshold: .15 });
      els.forEach(e => { if (!e.classList.contains('hero-delay')) io.observe(e); });
    }

    function renderAll(payload) {
      const d = payload.datos || {}, t = payload.plantilla || {};
      const m = Object.assign({}, t.media || {});
      Object.entries(d.medios || {}).forEach(([k, v]) => { if (v) m[k] = v; });
      const c = d.colores || {};
      const bg = c.fondo || t.fondo || '#f9f0e0';
      const ink = c.texto || t.texto || '#6c513f';
      const accent = c.acento || t.acento || '#a67d2b';
      const btnBg = c.boton || '#5a0f1b';

      document.documentElement.style.setProperty('--bg', bg);
      document.documentElement.style.setProperty('--ink', ink);
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--btn-bg', btnBg);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
      document.title = (d.nombre1 || 'Invitación') + (d.nombre2 ? ' & ' + d.nombre2 : '') + ' · N&S ATELIER';

      if (t.estilo === 'sacred-garden' || t.id === 'the-sacred-garden') renderSacredGarden(d, t, m);
      else renderClassic(d, t, m);

      setupIntro(m);
      startCountdown(d.fecha);
      wireRsvpModal();
      initObservers();
      $('loading').classList.add('hidden');
    }

    (async () => {
      const q = getQuery();
      try {
        const data = q ? await jsonp(q) : FALLBACK_SAMPLE;
        if (!data || !data.ok) throw Error(data?.error || 'Invitación no encontrada');
        renderAll(data);
      } catch (err) {
        showError(err.message + ' Verifica que la invitación esté en estado "Publicada".');
      }
    })();
  </script>
</body>
</html>
