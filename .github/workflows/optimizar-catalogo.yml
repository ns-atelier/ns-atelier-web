name: Optimizar portadas del catalogo
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/optimizar-catalogo.yml'
      - 'tools/build_catalog_thumbs.py'
permissions:
  contents: write
jobs:
  miniaturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/build_catalog_thumbs.py
      - name: Guardar portadas WebP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalogo/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Generar miniaturas WebP para el catalogo"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
