name: Optimizar multimedia de NYS Atelier

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'images/**'
      - 'inv/assets/**'
      - 'i/**'
      - 'tools/optimizar_multimedia.py'
      - '.github/workflows/optimizar-multimedia.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nys-optimizar-multimedia
  cancel-in-progress: false

jobs:
  optimizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar procesador de imágenes
        run: python -m pip install Pillow==11.3.0
      - name: Comprobar FFmpeg
        run: ffmpeg -version
      - name: Preparar recursos optimizados
        run: python tools/optimizar_multimedia.py
      - name: Publicar cambios, si existen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Optimizar multimedia y actualizar video nuevo"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Archivos multimedia ya optimizados."
          fi
