<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirigiendo · N&amp;S ATELIER</title>
  <script>
    (function () {
      const p = location.pathname;
      const parts = p.split('/').filter(Boolean);
      const i = parts.indexOf('inv');
      // /ns-atelier-web/inv/TOKEN -> /ns-atelier-web/inv/?t=TOKEN
      if (i >= 0 && parts[i+1] && parts[i+1] !== 'index.html') {
        const base = '/' + parts.slice(0, i + 1).join('/') + '/';
        location.replace(base + '?t=' + encodeURIComponent(parts[i+1]));
        return;
      }
      // /ns-atelier-web/catalogo -> /ns-atelier-web/catalogo.html
      const known = { catalogo: 'catalogo.html', condiciones: 'condiciones.html' };
      const last = parts[parts.length - 1] || '';
      if (known[last]) {
        location.replace('./' + known[last] + location.search + location.hash);
        return;
      }
      // Return to this project's root; do not jump to ns-atelier.github.io/.
      const root = p.startsWith('/ns-atelier-web/') ? '/ns-atelier-web/' : '/';
      location.replace(root);
    })();
  </script>
</head>
<body style="font-family:Georgia,serif;background:#f9f0e0;color:#6c513f;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
  <p>Abriendo tu invitación…</p>
</body>
</html>
